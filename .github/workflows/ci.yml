name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests (install.sh on macOS/Linux, install.ps1 on Windows, renderer, deploy guard)
        run: node --test --test-timeout=300000 "test/*.test.mjs"
      - name: Site is consistent
        run: node scripts/render-site.mjs check
